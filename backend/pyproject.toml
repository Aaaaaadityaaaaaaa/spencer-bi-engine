[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spencer-backend"
version = "0.1.0"
description = "Project Spencer Backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "duckdb",
    "ibis-framework[duckdb]",
    "redis",
    "sqlglot",
    "apscheduler",
    # pydantic[email] pulls in email-validator, needed for the EmailStr fields on
    # the auth request models (TASK-027).
    "pydantic[email]",
    "python-multipart",
    "msgpack",
    # LiteLLM is the single NL->SQL gateway (Phase 6): one call path routes to
    # Claude or Gemini by whichever API key is present in the env. ai_service
    # imports it defensively, so the rest of the API still runs if it is absent.
    "litellm",
    # Loads backend/.env at startup (main.py) so a locally-placed API key is honored
    # by the documented `uvicorn main:app` launch without an explicit --env-file.
    # Real deployments still win: load_dotenv(override=False) never clobbers a real
    # env var. Already pulled in transitively by litellm; declared here because
    # main.py imports it directly (same rule the fakeredis note above records).
    "python-dotenv",
    # openpyxl reads/writes .xlsx for ingestion (Foundation 3) and export
    # (Foundation 4), Wave 2 / TASK-020. Chosen over DuckDB's `excel` extension:
    # that extension needs a runtime network INSTALL and ships per-platform, which
    # breaks offline / cross-OS deploys. openpyxl is pure-Python and vendored.
    "openpyxl",
    # --- Auth & multi-tenancy (TASK-027) ---
    # SQLAlchemy 2.x is the identity/ownership store ORM (users + datasets),
    # dialect-neutral so the same code runs on SQLite (dev) and Postgres (prod).
    "sqlalchemy>=2.0",
    # PyJWT signs/verifies the HS256 bearer tokens. bcrypt hashes passwords -- used
    # DIRECTLY (not via passlib, which probes a __about__ attr bcrypt>=4.1 removed).
    "pyjwt>=2.8",
    "bcrypt>=4.0",
    # Postgres driver for the production APP_DB_URL (postgresql+psycopg://...).
    # Unused on the SQLite dev/default path; declared so a prod install has it.
    "psycopg[binary]>=3",
    "alembic>=1.19.1",
    "python-json-logger>=4.2.0",
    "prometheus-client>=0.26.0",
]

[project.optional-dependencies]
# fakeredis was imported by services/redis_manager.py without ever being
# declared -- a fresh `uv sync`/`pip install .` would have failed at import.
# It is the test-only fallback backend (ADR-011).
dev = [
    "fakeredis",
    "httpx",
]

[tool.setuptools]
# The backend is deployed as an APPLICATION, not a library: the Docker image
# delivers the source via `COPY . /app` + PYTHONPATH=/app and runs `uvicorn
# main:app`, so `pip install .` exists ONLY to resolve the dependencies above --
# it packages no modules of its own. Declaring packages/py-modules explicitly
# (empty) disables setuptools flat-layout auto-discovery, which would otherwise
# choke on the mix of loose modules (main.py, config.py, test_*.py) and the
# __init__-less namespace dirs (routers/, services/, models/).
packages = []
py-modules = []
